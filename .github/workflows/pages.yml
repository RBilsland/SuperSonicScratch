name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: |
            scratch-vm/package-lock.json
            scratch-gui/package-lock.json

      - name: Build scratch-vm
        working-directory: scratch-vm
        env:
          HUSKY: '0'
        run: |
          npm ci
          # npm run build runs jsdoc first, which exits 1 in CI despite succeeding; webpack alone is enough.
          npx webpack --progress

      - name: Build scratch-gui
        working-directory: scratch-gui
        env:
          HUSKY: '0'
        run: |
          npm ci
          # NODE_ENV must not be set during npm ci or devDependencies (rimraf, webpack) are skipped.
          NODE_ENV=production npm run build
          touch build/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: scratch-gui/build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
